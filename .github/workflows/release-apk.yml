name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'OtakuPlay Official Android Release'
      release_notes:
        description: 'Changelog / Release Notes'
        required: false
        default: 'Performance improvements, notch safe-area protection, offline downloads, and streaming updates.'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release OtakuPlay APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Compile Android APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Versioned APK Asset
        id: prepare
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          fi
          APK_NAME="OtakuPlay-${TAG}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.apk_name }}
          path: ${{ steps.prepare.outputs.apk_name }}
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          name: ${{ github.event.inputs.release_title || steps.prepare.outputs.tag }}
          body: |
            ## 📱 OtakuPlay ${{ steps.prepare.outputs.tag }}
            
            ${{ github.event.inputs.release_notes || 'Official Android release of OtakuPlay featuring offline downloads, notch & safe-area protection, multi-server streaming, and adaptive HLS playback.' }}
            
            ### 📦 Direct Downloads
            - **Download APK**: [${{ steps.prepare.outputs.apk_name }}](https://github.com/${{ github.repository }}/releases/download/${{ steps.prepare.outputs.tag }}/${{ steps.prepare.outputs.apk_name }})
          files: |
            ${{ steps.prepare.outputs.apk_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
